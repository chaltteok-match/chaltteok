services:
  db:
    image: postgres:16
    container_name: chaltteok-db
    env_file:
      - .env
    ports:
      # 왼쪽: 호스트(맥) 포트 / 오른쪽: 컨테이너 내부 포트(5432 고정)
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
