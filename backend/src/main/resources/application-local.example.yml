# 로컬 전용 설정 예시입니다.
# 사용 방법:
#   cp application-local.example.yml application-local.yml
#   application-local.yml의 값을 infra/.env와 동일하게 맞춥니다.
#   (DB명, 유저, 비밀번호, JDBC URL 포트 = POSTGRES_PORT)
#   application.yml에 spring.profiles.active=local 이 있어
#   ./gradlew bootRun 만으로 local 설정이 적용됩니다.
#
# application-local.yml은 Git에 커밋하지 마세요.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chaltteok
    username: chaltteok
    password: change-me
  jpa:
    hibernate:
      # 로컬 개발용. 운영 마이그레이션 도입 전까지 Entity 기준으로 스키마를 맞춘다.
      ddl-auto: update
